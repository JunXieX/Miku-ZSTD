name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 三个模块各自是独立的 Gradle 工程，并行构建互不干扰。
  velocity:
    name: Velocity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build & test
        working-directory: miku-zstd-velocity
        run: |
          # test 必须在 shadowJar 之前跑：协议回归测试（FrameLayoutTest 等）挂在
          # 本模块的 test 源集上，它保护的是跨端帧格式的字节对称性——
          # 那类错误不会编译失败，只会让两端静默错位。测试不过就不该产出产物。
          gradle test shadowJar --no-daemon
      - name: Show dict ablation report
        if: always()
        run: cat miku-zstd-velocity/build/ablation-report.txt || echo "(no report)"
      - uses: actions/upload-artifact@v4
        with:
          name: Miku-ZSTD-Velocity
          retention-days: 1
          path: miku-zstd-velocity/build/libs/Miku-ZSTD-*-Velocity.jar
          if-no-files-found: error

  paper:
    name: Paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build
        working-directory: miku-zstd-paper
        run: gradle test shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Miku-ZSTD-Paper
          retention-days: 1
          path: miku-zstd-paper/build/libs/Miku-ZSTD-*-Paper.jar
          if-no-files-found: error

  fabric:
    name: Fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build
        working-directory: miku-zstd-fabric
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Miku-ZSTD-Fabric
          retention-days: 1
          path: miku-zstd-fabric/build/libs/Miku-ZSTD-*-Fabric.jar
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # 真机冒烟：一台真 Paper + 本仓库插件 + 协议级模拟客户端。
  #
  # 为什么必须单独有这个 job：EmbeddedChannel 测不出"写是否来自非 event loop 线程"，
  # 也测不出登录期的出站顺序 —— 而这两类问题只会让"玩家进不去服"，只能靠真实 NIO
  # 连接验证。它同时是帧格式 v6 的唯一端到端验证（dictGen / 直存帧同形 / flush 成帧）。
  #
  # 脚本内联在 workflow 里（仓库只入库源码与构建文件，见 .gitignore 的约定）。
  # ──────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Paper, threshold=${{ matrix.threshold }}, client=${{ matrix.negotiate }})
    strategy:
      matrix:
        threshold: [0, 256]
        negotiate: [11, 10]
    needs: [paper]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: Miku-ZSTD-Paper
          path: dist
      - name: Fetch Paper 26.2
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://fill.papermc.io/v3/projects/paper/versions/26.2/builds \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["downloads"]["server:default"]["url"])')
          echo "paper=$URL"
          curl -fsSL "$URL" -o paper.jar
          ls -l paper.jar
      - name: Prepare server
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          cp dist/*.jar server/plugins/
          cd server
          echo "eula=true" > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          network-compression-threshold=${{ matrix.threshold }}
          server-port=25600
          server-ip=127.0.0.1
          level-type=minecraft\:flat
          spawn-protection=0
          max-players=5
          view-distance=2
          simulation-distance=2
          sync-chunk-writes=false
          enable-command-block=false
          motd=MikuZSTD-E2E
          EOF
          ls plugins/
      - name: Start Paper
        run: |
          set -euo pipefail
          cd server
          nohup java -Xms768M -Xmx1536M -jar ../paper.jar --nogui > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 180); do
            if grep -q 'Done (' server.log; then echo "server up in ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not start"; tail -80 server.log; exit 1
      - name: Run protocol client
        run: |
          set -euo pipefail
          python3 -m pip install --quiet zstandard
          python3 - <<'PY'
          import socket, struct, sys, time, zlib
          import zstandard as zstd

          HOST, PORT = "127.0.0.1", 25600
          MAGIC = 0x5A535743
          PROTOCOL = 776
          NEGOTIATE = 11
          CLIENT_NEGOTIATE = int("${{ matrix.negotiate }}")
          expected_zstd = CLIENT_NEGOTIATE == NEGOTIATE
          required = ["set_compression", "negotiate"] + (["switch", "frame"] if expected_zstd else ["vanilla_login"])

          def varint(n):
              out = bytearray()
              while True:
                  b = n & 0x7F
                  n >>= 7
                  if n: out.append(b | 0x80)
                  else:
                      out.append(b); return bytes(out)

          def s(x):
              b = x.encode(); return varint(len(b)) + b

          def recvn(sock, n):
              d = b""
              while len(d) < n:
                  c = sock.recv(n - len(d))
                  if not c: raise EOFError("eof")
                  d += c
              return d

          def rv(sock):
              num = 0; sh = 0
              while True:
                  c = recvn(sock, 1)[0]
                  num |= (c & 0x7F) << sh
                  if not (c & 0x80): return num
                  sh += 7
                  if sh > 35: raise ValueError("varint too long")

          def dv(buf, pos):
              num = 0; sh = 0
              while True:
                  b = buf[pos]; pos += 1
                  num |= (b & 0x7F) << sh
                  if not (b & 0x80): return num, pos
                  sh += 7

          def send(sock, packet, threshold):
              use_zlib = threshold is not None and len(packet) >= threshold
              if threshold is None:
                  body = packet
              elif use_zlib:
                  body = varint(len(packet)) + zlib.compress(packet)
              else:
                  body = b"\x00" + packet
              sock.sendall(varint(len(body)) + body)
              return use_zlib

          def vanilla_packet(body, threshold):
              if threshold is None:
                  return body
              raw, pos = dv(body, 0)
              if raw == 0:
                  return body[pos:]
              packet = zlib.decompress(body[pos:])
              assert len(packet) == raw, "原版压缩帧解压长度不符"
              return packet

          sock = socket.create_connection((HOST, PORT), timeout=20)
          sock.settimeout(25)
          hs = varint(0) + varint(PROTOCOL) + s("127.0.0.1\x00ZSTD\x00") + struct.pack(">H", PORT) + varint(2)
          sock.sendall(varint(len(hs)) + hs)
          uid = b"\x01" * 16
          ls = varint(0) + s("E2EBot") + uid
          sock.sendall(varint(len(ls)) + ls)

          seen = {"set_compression": False, "negotiate": False, "switch": False, "frame": False, "vanilla_login": False}
          frames = 0
          compressed = False
          compression_threshold = None
          zstd_mode = False
          pending_negotiate = None
          deadline = time.time() + 40
          rc = 1
          try:
              while time.time() < deadline:
                  ln = rv(sock)
                  body = recvn(sock, ln)
                  if not body: break
                  if not zstd_mode:
                      packet = vanilla_packet(body, compression_threshold)
                  else:
                      raw, pos = dv(body, 0)
                      if raw == 0:
                          # 直存帧同样是 v7 帧（与原版未压缩帧逐字节同形）：小包本来就该走这条路径。
                          # 只认压缩帧会让用例在"首个包很小"时误判失败。
                          packet = body[pos:]
                          pid2, _ = dv(packet, 0)
                          print("  stored frame, %d bytes, packet id=%d" % (len(packet), pid2))
                          seen["frame"] = True
                          frames += 1
                          # 首个帧就够：真机上这通常正是 LoginSuccess（包 id 0x02）。
                          # 再往后是 configuration 阶段，需要客户端回 ClientInformation 才会继续推，
                          # 本用例不复述那一整套（压缩帧路径由单测与 dictGen 校验覆盖）。
                          if pid2 == 0x02:
                              print("E2E_PASS login_success_in_zstd_frame")
                          else:
                              print("E2E_PASS frame_ok packet id=%d" % pid2)
                          rc = 0
                          break
                      else:
                          # 压缩帧：[rawSize][dictGen][blockCount] + 每块 [blockRawLen][chunkLen][chunk]
                          gen, pos = dv(body, pos)
                          blocks, pos = dv(body, pos)
                          print("  compressed frame rawSize=%d dictGen=%d blocks=%d" % (raw, gen, blocks))
                          assert gen == 0, "首次登录不该出现滚动历史代数（gen=%d）" % gen
                          total = 0
                          for i in range(blocks):
                              br, pos = dv(body, pos)
                              cl, pos = dv(body, pos)
                              chunk = body[pos:pos + cl]; pos += cl
                              assert br > 0 and cl > 0 and len(chunk) == cl, "压缩块长度或边界非法"
                              dec = zstd.ZstdDecompressor(format=zstd.FORMAT_ZSTD1_MAGICLESS)
                              out = dec.decompress(chunk, max_output_size=br, allow_extra_data=False)
                              assert len(out) == br, "块 %d 解压长度不符 %d != %d" % (i, len(out), br)
                              total += len(out)
                          assert pos == len(body), "压缩帧存在截断或尾随字节"
                          assert total == raw, "块合计 %d != rawSize %d" % (total, raw)
                          seen["frame"] = True
                          print("E2E_PASS frame_ok")
                          rc = 0
                          break
                  pid, pos = dv(packet, 0)
                  if pid == 0x03 and not compressed:
                      thr, _ = dv(packet, pos)
                      seen["set_compression"] = True
                      compressed = True
                      compression_threshold = thr
                      assert thr == int("${{ matrix.threshold }}"), "SetCompression 阈值与矩阵不符"
                      print("  SetCompression threshold=%d" % thr)
                      if pending_negotiate is not None:
                          pending_tx, pending_status = pending_negotiate
                          assert pending_status == 2 and not expected_zstd
                          send(sock, varint(0x02) + varint(pending_tx) + b"\x01" + varint(pending_status), compression_threshold)
                          pending_negotiate = None
                          seen["negotiate"] = True
                          print("  deferred fallback answered after SetCompression")
                  elif pid == 0x04:
                      tx, p = dv(packet, pos)
                      sl, p = dv(packet, p)
                      chan = packet[p:p + sl].decode()
                      payload = packet[p + sl:]
                      if chan == "zstd:negotiate":
                          server_version = struct.unpack(">i", payload)[0]
                          assert server_version == NEGOTIATE, "服务端协商版本应为 11"
                          status = 0 if server_version == CLIENT_NEGOTIATE else 2
                          if status == 2 and compression_threshold is None:
                              pending_negotiate = (tx, status)
                              print("  fallback answer deferred until SetCompression")
                              continue
                          assert status != 2 or seen["set_compression"], "旧版回落应答必须晚于 SetCompression"
                          send(sock, varint(0x02) + varint(tx) + b"\x01" + varint(status), compression_threshold)
                          seen["negotiate"] = True
                          print("  negotiate answered")
                      elif chan == "zstd:switch":
                          assert expected_zstd, "版本 10 客户端保持原版时不应收到切换询问"
                          confirm = varint(0x02) + varint(tx) + b"\x01" + struct.pack(">I", MAGIC)
                          zlib_confirm = send(sock, confirm, compression_threshold)
                          assert zlib_confirm == (compression_threshold == 0), "确认帧应遵守原版压缩阈值"
                          print("  vanilla switch confirm: %s" % ("zlib" if zlib_confirm else "stored"))
                          seen["switch"] = True
                          zstd_mode = True
                          print("  switch confirmed -> zstd mode")
                      else:
                          send(sock, varint(0x02) + varint(tx) + b"\x00", compression_threshold)
                  elif pid == 0x00:
                      print("  DISCONNECT: %s" % packet[pos:pos + 120])
                      break
                  elif pid == 0x02:
                      assert not expected_zstd, "版本 11 客户端应启用下行 zstd"
                      assert pending_negotiate is None and seen["negotiate"], "原版登录前必须已发送回落应答"
                      seen["vanilla_login"] = True
                      print("E2E_PASS version_mismatch_stays_vanilla")
                      rc = 0
                      break
          except Exception as e:
              print("client error: %s: %s" % (type(e).__name__, e))
          finally:
              sock.close()
          for k, v in seen.items():
              print("  seen %-16s %s" % (k, v))
          sys.exit(0 if (rc == 0 and all(seen[key] for key in required)) else 1)
          PY
      - name: Verify server log
        if: always()
        run: |
          set -euo pipefail
          cd server
          echo "----- activation / fallback lines -----"
          grep -E "zstd transport activated|anchors 未出现|frame rejected|dict generation mismatch|保持原版 zlib" server.log || true
          echo "----- check -----"
          if [ "${{ matrix.negotiate }}" = "11" ]; then
            grep -q "zstd transport activated on Paper" server.log || { echo "未激活：zstd 没有生效"; tail -60 server.log; exit 1; }
          else
            if grep -q "zstd transport activated on Paper" server.log; then echo "旧版客户端误激活"; exit 1; fi
            grep -q "保持原版 zlib" server.log || { echo "旧版客户端未回落原版"; exit 1; }
          fi
          if grep -q "dict generation mismatch" server.log; then echo "滚动历史分叉"; exit 1; fi
          if grep -q "frame rejected" server.log; then echo "帧被拒"; exit 1; fi
          echo "server-side assertions OK"
      - name: Stop server
        if: always()
        run: |
          cd server 2>/dev/null || exit 0
          [ -f server.pid ] && kill "$(cat server.pid)" 2>/dev/null || true
          sleep 2

  # ──────────────────────────────────────────────────────────────────────
  # Velocity 端真机冒烟：真代理 + 协议级客户端，只跑到"登录完成"。
  #
  # 为什么要单独一个 job：v7 在 Velocity 上走的字节路径与 Paper 不同（外层 bodyLen 由
  # 编码器自带、且没有 prepender）。2026-11-01 的 5.0.36 就只在代理端坏掉，而 Paper 的
  # E2E 全绿 —— 这条路径当时没有任何门禁。
  #
  # 不需要后端服务器：本用例只验证登录阶段（SetCompression → negotiate → switch →
  # 第一个 zstd 帧），LoginSuccess 在选服之前就发出了。
  # ──────────────────────────────────────────────────────────────────────
  e2e-velocity:
    name: E2E (Velocity, threshold=${{ matrix.threshold }}, client=${{ matrix.negotiate }})
    strategy:
      matrix:
        threshold: [0, 256]
        negotiate: [11, 10]
    needs: [velocity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: Miku-ZSTD-Velocity
          path: dist
      - name: Fetch Velocity 4.3.1
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://fill.papermc.io/v3/projects/velocity/versions/4.3.1/builds \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["downloads"]["server:default"]["url"])')
          echo "velocity=$URL"
          curl -fsSL "$URL" -o velocity.jar
          ls -l velocity.jar
      - name: Prepare Velocity
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          cp dist/*.jar server/plugins/
          cd server
          cat > velocity.toml <<'EOF'
          bind = "0.0.0.0:25565"
          motd = "MikuZSTD E2E"
          online-mode = false
          player-info-forwarding-mode = "none"
          log-player-connections = true
          log-command-executions = false

          # 必须注册一个服务器：Velocity 会因为"fallback 服务器未注册"直接拒绝启动。
          # 本用例只跑到登录完成（LoginSuccess 在选服之前就发出），所以这里给一个必然连不上的
          # 占位后端即可 —— 客户端在收到第一个 zstd 帧时就退出，不会走到选服。
          [servers]
          lobby = "127.0.0.1:25601"
          try = ["lobby"]

          [forced-hosts]

          [advanced]
          compression-threshold = ${{ matrix.threshold }}
          compression-level = -1
          login-ratelimit = 0
          EOF
          ls plugins/
      - name: Start Velocity
        run: |
          set -euo pipefail
          cd server
          nohup java -Xms256M -Xmx512M -jar ../velocity.jar > velocity.log 2>&1 &
          echo $! > velocity.pid
          for i in $(seq 1 120); do
            if grep -qE 'Done \(|Listening on' velocity.log; then echo "velocity up in ${i}s"; exit 0; fi
            sleep 1
          done
          echo "velocity did not start"; tail -80 velocity.log; exit 1
      - name: Run protocol client
        run: |
          set -euo pipefail
          python3 -m pip install --quiet zstandard
          python3 - <<'PY'
          import socket, struct, sys, time, zlib
          import zstandard as zstd
          HOST, PORT = "127.0.0.1", 25565
          MAGIC = 0x5A535743
          PROTOCOL = 776
          NEGOTIATE = 11
          CLIENT_NEGOTIATE = int("${{ matrix.negotiate }}")
          expected_zstd = CLIENT_NEGOTIATE == NEGOTIATE
          required = ["set_compression", "negotiate"] + (["switch", "frame"] if expected_zstd else ["vanilla_login"])

          def varint(n):
              out = bytearray()
              while True:
                  b = n & 0x7F; n >>= 7
                  if n: out.append(b | 0x80)
                  else:
                      out.append(b); return bytes(out)

          def s(x):
              b = x.encode(); return varint(len(b)) + b

          def recvn(sock, n):
              d = b""
              while len(d) < n:
                  c = sock.recv(n - len(d))
                  if not c: raise EOFError("eof")
                  d += c
              return d

          def rv(sock):
              num = 0; sh = 0
              while True:
                  c = recvn(sock, 1)[0]; num |= (c & 0x7F) << sh
                  if not (c & 0x80): return num
                  sh += 7
                  if sh > 35: raise ValueError("varint too long")

          def dv(buf, pos):
              num = 0; sh = 0
              while True:
                  b = buf[pos]; pos += 1; num |= (b & 0x7F) << sh
                  if not (b & 0x80): return num, pos
                  sh += 7

          def send(sock, packet, threshold):
              use_zlib = threshold is not None and len(packet) >= threshold
              if threshold is None:
                  body = packet
              elif use_zlib:
                  body = varint(len(packet)) + zlib.compress(packet)
              else:
                  body = b"\x00" + packet
              sock.sendall(varint(len(body)) + body)
              return use_zlib

          def vanilla_packet(body, threshold):
              if threshold is None:
                  return body
              raw, pos = dv(body, 0)
              if raw == 0:
                  return body[pos:]
              packet = zlib.decompress(body[pos:])
              assert len(packet) == raw, "原版压缩帧解压长度不符"
              return packet

          sock = socket.create_connection((HOST, PORT), timeout=20)
          sock.settimeout(25)
          hs = varint(0) + varint(PROTOCOL) + s("127.0.0.1\x00ZSTD\x00") + struct.pack(">H", PORT) + varint(2)
          sock.sendall(varint(len(hs)) + hs)
          ls = varint(0) + s("E2EVelocity") + b"\x02" * 16
          sock.sendall(varint(len(ls)) + ls)

          seen = {"set_compression": False, "negotiate": False, "switch": False, "frame": False, "vanilla_login": False}
          compressed = False; compression_threshold = None; zstd_mode = False; rc = 1
          pending_negotiate = None
          deadline = time.time() + 40
          try:
              while time.time() < deadline:
                  ln = rv(sock); body = recvn(sock, ln)
                  if not body: break
                  if not zstd_mode:
                      packet = vanilla_packet(body, compression_threshold)
                  else:
                      raw, pos = dv(body, 0)
                      if raw == 0:
                          packet = body[pos:]
                          pid2, _ = dv(packet, 0)
                          print("  stored frame, %d bytes, packet id=%d" % (len(packet), pid2))
                          seen["frame"] = True
                          print("E2E_PASS frame_ok packet id=%d" % pid2); rc = 0; break
                      gen, pos = dv(body, pos)
                      blocks, pos = dv(body, pos)
                      print("  compressed frame rawSize=%d dictGen=%d blocks=%d" % (raw, gen, blocks))
                      assert gen == 0, "首次登录不该出现滚动历史代数（gen=%d）" % gen
                      total = 0
                      for i in range(blocks):
                          br, pos = dv(body, pos); cl, pos = dv(body, pos)
                          chunk = body[pos:pos + cl]; pos += cl
                          assert br > 0 and cl > 0 and len(chunk) == cl, "压缩块长度或边界非法"
                          dec = zstd.ZstdDecompressor(format=zstd.FORMAT_ZSTD1_MAGICLESS)
                          out = dec.decompress(chunk, max_output_size=br, allow_extra_data=False)
                          assert len(out) == br, "块 %d 解压长度不符 %d != %d" % (i, len(out), br)
                          total += len(out)
                      assert pos == len(body), "压缩帧存在截断或尾随字节"
                      assert total == raw, "块合计 %d != rawSize %d" % (total, raw)
                      seen["frame"] = True
                      print("E2E_PASS compressed_frame_ok"); rc = 0; break
                  pid, pos = dv(packet, 0)
                  if pid == 0x03 and not compressed:
                      thr, _ = dv(packet, pos); compressed = True; compression_threshold = thr
                      assert thr == int("${{ matrix.threshold }}"), "SetCompression 阈值与矩阵不符"
                      seen["set_compression"] = True
                      print("  SetCompression threshold=%d" % thr)
                      if pending_negotiate is not None:
                          pending_tx, pending_status = pending_negotiate
                          assert pending_status == 2 and not expected_zstd
                          send(sock, varint(0x02) + varint(pending_tx) + b"\x01" + varint(pending_status), compression_threshold)
                          pending_negotiate = None
                          seen["negotiate"] = True
                          print("  deferred fallback answered after SetCompression")
                  elif pid == 0x04:
                      tx, pp = dv(packet, pos); sl, pp = dv(packet, pp)
                      chan = packet[pp:pp + sl].decode()
                      payload = packet[pp + sl:]
                      if chan == "zstd:negotiate":
                          server_version = struct.unpack(">i", payload)[0]
                          assert server_version == NEGOTIATE, "服务端协商版本应为 11"
                          status = 0 if server_version == CLIENT_NEGOTIATE else 2
                          if status == 2 and compression_threshold is None:
                              pending_negotiate = (tx, status)
                              print("  fallback answer deferred until SetCompression")
                              continue
                          assert status != 2 or seen["set_compression"], "旧版回落应答必须晚于 SetCompression"
                          send(sock, varint(0x02) + varint(tx) + b"\x01" + varint(status), compression_threshold)
                          seen["negotiate"] = True; print("  negotiate answered")
                      elif chan == "zstd:switch":
                          assert expected_zstd, "版本 10 客户端保持原版时不应收到切换询问"
                          confirm = varint(0x02) + varint(tx) + b"\x01" + struct.pack(">I", MAGIC)
                          zlib_confirm = send(sock, confirm, compression_threshold)
                          assert zlib_confirm == (compression_threshold == 0), "确认帧应遵守原版压缩阈值"
                          print("  vanilla switch confirm: %s" % ("zlib" if zlib_confirm else "stored"))
                          seen["switch"] = True; zstd_mode = True; print("  switch confirmed -> zstd mode")
                      else:
                          send(sock, varint(0x02) + varint(tx) + b"\x00", compression_threshold)
                  elif pid == 0x00:
                      print("  DISCONNECT: %s" % packet[pos:pos + 160]); break
                  elif pid == 0x02:
                      assert not expected_zstd, "版本 11 客户端应启用下行 zstd"
                      assert pending_negotiate is None and seen["negotiate"], "原版登录前必须已发送回落应答"
                      seen["vanilla_login"] = True
                      print("E2E_PASS version_mismatch_stays_vanilla"); rc = 0; break
          except Exception as e:
              print("client error: %s: %s" % (type(e).__name__, e))
          finally:
              sock.close()
          for k, v in seen.items():
              print("  seen %-16s %s" % (k, v))
          sys.exit(0 if (rc == 0 and all(seen[key] for key in required)) else 1)
          PY
      - name: Verify velocity log
        if: always()
        run: |
          set -euo pipefail
          cd server
          echo "----- zstd lines -----"
          grep -E "zstd|Zstd" velocity.log | tail -30 || true
          echo "----- check -----"
          if [ "${{ matrix.negotiate }}" = "11" ]; then
            grep -q "Zstd transport activated" velocity.log || { echo "未激活"; tail -60 velocity.log; exit 1; }
          else
            if grep -q "Zstd transport activated" velocity.log; then echo "旧版客户端误激活"; exit 1; fi
            grep -q "保持原版 zlib" velocity.log || { echo "旧版客户端未回落原版"; exit 1; }
          fi
          if grep -q "dict generation mismatch" velocity.log; then echo "滚动历史分叉"; exit 1; fi
          if grep -q "frame rejected" velocity.log; then echo "帧被拒"; exit 1; fi
          echo "velocity-side assertions OK"
      - name: Stop Velocity
        if: always()
        run: |
          cd server 2>/dev/null || exit 0
          [ -f velocity.pid ] && kill "$(cat velocity.pid)" 2>/dev/null || true
          sleep 2

  packages:
    name: Package Metadata
    needs: [velocity, paper, fabric]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify packaged versions and transport classes
        run: |
          python3 - <<'PY'
          import json, re, zipfile
          from pathlib import Path

          properties = Path("miku-zstd-fabric/gradle.properties").read_text(encoding="utf-8")
          version = re.search(r"^mod_version=(.+)$", properties, re.M).group(1).strip()
          for module in ("paper", "velocity"):
              build = Path(f"miku-zstd-{module}/build.gradle").read_text(encoding="utf-8")
              actual = re.search(r"^version\s*=\s*'([^']+)'", build, re.M).group(1)
              assert actual == version, f"{module}: build version {actual} != {version}"
          plans = [
              ("Fabric", "fabric.mod.json", "cn/miku/zstd/ZstdBatchDecoder.class", "cn/miku/zstd/ZstdBatchEncoder.class"),
              ("Paper", "paper-plugin.yml", "mikumc/zstd/paper/ZstdPaperEncoder.class", "mikumc/zstd/paper/ZstdPaperDecoder.class"),
              ("Velocity", "velocity-plugin.json", "mikumc/zstd/ZstdBatchEncoder.class", "mikumc/zstd/ZstdBatchDecoder.class"),
          ]
          assert len(list(Path("dist").glob("*.jar"))) == len(plans), "Expected exactly three deployable jars"
          for module, descriptor, required, removed in plans:
              jar = Path("dist") / f"Miku-ZSTD-{version}-{module}.jar"
              assert jar.is_file(), f"Missing artifact: {jar}"
              with zipfile.ZipFile(jar) as archive:
                  text = archive.read(descriptor).decode("utf-8")
                  if descriptor.endswith(".json"):
                      actual = json.loads(text)["version"]
                  else:
                      match = re.search(r"^version:\s*['\"]?([^'\"\s]+)", text, re.M)
                      assert match, f"{module}: descriptor version missing"
                      actual = match.group(1)
                  assert actual == version, f"{module}: packaged version {actual} != {version}"
                  names = set(archive.namelist())
                  assert required in names, f"{module}: downstream handler missing"
                  assert removed not in names, f"{module}: obsolete upstream handler still packaged"
              print(f"[OK] {jar.name}: version={actual}, downstream present, upstream removed")
          PY

  release:
    name: Release
    needs: [velocity, paper, fabric, e2e, e2e-velocity, packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 取回完整历史：下面要用 git log 读 tag 指向提交的完整正文，
      # 浅克隆下 tag 的提交对象可能不完整。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -R dist
      # ── 结构化更新日志 ────────────────────────────────────────────────────
      # 正文来源：**发版提交的完整提交信息**（发版时把更新日志写进提交正文）。
      # 正文为空或 tag 与任一端版本不一致时中止，避免发布缺少说明或版本错位的产物。
      # ⚠️ 为什么不用 generate_release_notes：它只会生成
      # "**Full Changelog**: compare/... 链接"，正文里没有任何"改了什么"——
      # 4.10.0 就是这样发的（Release 与 Modrinth 都只有那条链接，等于没说明）。
      # ⚠️ 为什么不用附注 tag 的说明：CI 里 checkout 出来的 tag 实体在部分情况下
      # 是"指向提交的轻量引用"，'%(contents)' 会取到提交信息而非 tag 说明，
      # 行为不确定。以**发版提交正文**为唯一来源，语义最稳且只依赖提交本身。
      - name: Compose release body
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PAPER_VERSION=$(sed -n "s/^version = '\([^']*\)'.*/\1/p" miku-zstd-paper/build.gradle)
          VELOCITY_VERSION=$(sed -n "s/^version = '\([^']*\)'.*/\1/p" miku-zstd-velocity/build.gradle)
          FABRIC_VERSION=$(sed -n 's/^mod_version=//p' miku-zstd-fabric/gradle.properties | tr -d '\r')
          if [ "$VERSION" != "$PAPER_VERSION" ] || [ "$VERSION" != "$VELOCITY_VERSION" ] || [ "$VERSION" != "$FABRIC_VERSION" ]; then
            echo "版本标签与三端构建版本不一致" >&2
            exit 1
          fi
          git log -1 --format='%b' "$TAG" > /tmp/body.md
          if ! grep -q '[^[:space:]]' /tmp/body.md || ! grep -Eq '^## (新增|修复|说明)' /tmp/body.md; then
            echo "发版提交缺少结构化更新日志正文" >&2
            exit 1
          fi
          echo "----- release body -----"
          cat /tmp/body.md
          echo "------------------------"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          body_path: /tmp/body.md
          prerelease: ${{ contains(github.ref_name, 'Beta') }}

  # Modrinth 只在**正式版**（tag 不含 Beta）发布：测试版完全跳过，连 job 都不进。
  # 发布逻辑内联在这里，不往仓库里加脚本文件（仓库只允许源码与 README）。
  #
  # ⚠️ needs 必须是 release（而不是三个构建 job）：下面的 changelog 要读 GitHub Release
  # 的正文当唯一来源。若与 release 并行启动，Release 往往还没建好，于是静默退回兜底文案——
  # 4.3.0 就是这样发的（正文是事后用 API 补的）。
  modrinth:
    name: Modrinth
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'Beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_PROJECT: qQZo9ztT
          GAME_VERSIONS: "26.2,26.3"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, uuid

          TOKEN = os.environ["MODRINTH_TOKEN"]
          PROJECT = os.environ["MODRINTH_PROJECT"]
          GVS = [x for x in os.environ["GAME_VERSIONS"].split(",") if x]
          TAG = os.environ["GITHUB_REF_NAME"]
          VERSION = TAG[1:] if TAG.startswith("v") else TAG
          REPO = os.environ["GITHUB_REPOSITORY"]
          DIST = "dist"

          def http(url, method="GET", data=None, headers=None):
              req = urllib.request.Request(url, data=data, method=method)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      raw = r.read().decode("utf-8")
                      return r.status, (json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:400]

          def mr(method, path, data=None, ctype="application/json"):
              return http("https://api.modrinth.com/v2" + path, method, data,
                          {"User-Agent": "JunXieX/Miku-ZSTD-ci (github.com/JunXieX)",
                           "Authorization": TOKEN,
                           **({"Content-Type": ctype} if data else {})})

          def multipart(fields, files):
              b = "----MikuMC" + uuid.uuid4().hex
              buf = bytearray()
              for k, v in fields.items():
                  buf += ("--%s\r\nContent-Disposition: form-data; name=\"%s\"\r\n\r\n%s\r\n"
                          % (b, k, v)).encode("utf-8")
              for k, (fn, content) in files.items():
                  buf += ("--%s\r\nContent-Disposition: form-data; name=\"%s\"; filename=\"%s\"\r\n"
                          "Content-Type: application/java-archive\r\n\r\n" % (b, k, fn)).encode("utf-8")
                  buf += content + b"\r\n"
              buf += ("--%s--\r\n" % b).encode("utf-8")
              return bytes(buf), "multipart/form-data; boundary=%s" % b

          # changelog 复用 GitHub Release 正文（单一来源），取不到才用兜底文案
          changelog = "Miku-ZSTD %s" % VERSION
          st, rel = http("https://api.github.com/repos/%s/releases/tags/%s" % (REPO, TAG),
                         headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                                  "Accept": "application/vnd.github+json"})
          if st == 200 and rel.get("body", "").strip():
              changelog = rel["body"]
          else:
              print("[warn] 取 GitHub Release 正文失败（HTTP %s），使用兜底 changelog" % st)

          # 已有版本，用于幂等：重复跑同一次发布不应产生重复版本
          st, existing = mr("GET", "/project/%s/version" % PROJECT)
          have = set()
          if st == 200 and isinstance(existing, list):
              for v in existing:
                  have.add((v.get("version_number"), tuple(sorted(v.get("loaders") or []))))
          print("已有版本:", sorted(have))

          # ⚠️ 必须按 loader 拆成独立版本：Modrinth 要求**同一版本内所有文件**都满足
          # 该 loader 的元数据（paper 要 paper-plugin.yml、fabric 要 fabric.mod.json），
          # 三种产物混在一个版本里会被 400 拒绝。
          PLAN = [
              ("-Velocity.jar", ["velocity"], "server_only"),
              ("-Paper.jar",    ["paper"],    "server_only"),
              ("-Fabric.jar",   ["fabric"],   "client_only"),
          ]

          rc = 0
          for suffix, loaders, env in PLAN:
              key = (VERSION, tuple(sorted(loaders)))
              if key in have:
                  print("[skip] %s %s 已存在" % (VERSION, "/".join(loaders)))
                  continue
              jar = os.path.join(DIST, "Miku-ZSTD-%s%s" % (VERSION, suffix))
              if not os.path.isfile(jar):
                  print("[skip] 找不到 %s" % jar)
                  continue
              with open(jar, "rb") as f:
                  content = f.read()
              data = {
                  "project_id": PROJECT,
                  "name": "Miku-ZSTD %s (%s)" % (VERSION, " + ".join(l.capitalize() for l in loaders)),
                  "version_number": VERSION,
                  "changelog": changelog,
                  "version_type": "release",
                  "game_versions": GVS,
                  "loaders": loaders,
                  "environment": env,
                  "file_parts": ["file"],
                  "primary_file": "file",
                  "status": "listed",
                  "featured": False,
                  "dependencies": [],
              }
              body, ctype = multipart({"data": json.dumps(data, ensure_ascii=False)},
                                      {"file": (os.path.basename(jar), content)})
              st, resp = mr("POST", "/version", body, ctype)
              print("POST /version [%s] -> HTTP %s" % ("/".join(loaders), st))
              if st in (200, 201):
                  print("  已发布 id=%s number=%s" % (resp.get("id"), resp.get("version_number")))
              else:
                  print("  错误: %s" % resp)
                  rc = 1
          raise SystemExit(rc)
          PY
