name: Real Client Smoke

# Manual real-game smoke on an isolated private lab runner. Does not gate releases.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build run ID for this exact commit
        required: true
        type: string
      duration_seconds:
        description: Play-state observation duration after login
        required: false
        default: "120"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: miku-zstd-private-lab
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run_allowed: ${{ steps.check.outputs.run_allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          RUNNER_READY: ${{ vars.MZSTD_REAL_CLIENT_RUNNER_READY }}
          SMOKE_CONFIG: ${{ vars.MZSTD_SMOKE_CONFIG }}
          SMOKE_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] || [[ "$RUNNER_READY" != "true" ]] || [[ -z "$SMOKE_CONFIG" ]]; then
            echo "run_allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Smoke requires trusted main and an enabled lab runner; skipped, not passed."
            exit 0
          fi
          if ! [[ "$SMOKE_SECONDS" =~ ^[0-9]+$ ]] || (( SMOKE_SECONDS < 30 || SMOKE_SECONDS > 600 )); then
            echo "duration_seconds must be between 30 and 600" >&2
            exit 1
          fi
          actual=$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,headSha,status,conclusion)
          python3 -c 'import json,os,sys; d=json.loads(sys.argv[1]); assert d["workflowName"]=="Build" and d["headBranch"]=="main" and d["headSha"]==os.environ["EXPECTED_SHA"] and d["status"]=="completed" and d["conclusion"]=="success", d' "$actual"
          echo "run_allowed=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.check.outputs.run_allowed != 'true' }}
        run: |
          echo "Real-client smoke skipped: configure the dedicated lab runner. This is not a pass." >> "$GITHUB_STEP_SUMMARY"
  smoke:
    needs: preflight
    if: ${{ needs.preflight.outputs.run_allowed == 'true' }}
    runs-on: [self-hosted, linux, x64, miku-zstd-real-client]
    timeout-minutes: 30
    env:
      MZSTD_SMOKE_CONFIG: ${{ vars.MZSTD_SMOKE_CONFIG }}
      SMOKE_SECONDS: ${{ inputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: Miku-ZSTD-*
          path: dist
          merge-multiple: true
      - name: Allocate invocation-specific private evidence directory
        id: evidence
        run: |
          set -euo pipefail
          umask 077
          result=$(mktemp -d "$RUNNER_TEMP/miku-zstd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXXXX")
          echo "dir=$result" >> "$GITHUB_OUTPUT"
          echo "EVIDENCE_DIR=$result" >> "$GITHUB_ENV"
          echo "RESULT_DIR=$result/scenario" >> "$GITHUB_ENV"
          echo "MZSTD_RUN_NONCE=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Inspect installed lab prerequisites (not a game test)
        run: |
          set -euo pipefail
          mkdir -m 700 "$EVIDENCE_DIR/sanitized"
          python3 scripts/ci/runner_doctor.py --config "$MZSTD_SMOKE_CONFIG" \
            --report-json "$EVIDENCE_DIR/sanitized/runner-preflight.json"
      - name: Check private harness contract
        run: |
          set -euo pipefail
          test -r "$MZSTD_SMOKE_CONFIG"
          test -s dist/Miku-ZSTD-*-Fabric.jar
          test -s dist/Miku-ZSTD-*-Paper.jar
      - name: Run actual Fabric + Krypton client through compressed FRP
        run: |
          set -euo pipefail
          result="$RESULT_DIR"
          python3 scripts/ci/lab_harness.py smoke --config "$MZSTD_SMOKE_CONFIG" \
            --fabric-jar "$GITHUB_WORKSPACE"/dist/Miku-ZSTD-*-Fabric.jar \
            --paper-jar "$GITHUB_WORKSPACE"/dist/Miku-ZSTD-*-Paper.jar \
            --frp-compression true --duration-seconds "$SMOKE_SECONDS" --candidate-sha "$GITHUB_SHA" --result-dir "$result"
          python3 scripts/ci/validate_real_client_result.py smoke "$result/summary.json" \
            --expected-clients 1 --expected-sha "$GITHUB_SHA" \
            --min-duration-seconds "$SMOKE_SECONDS" --expected-nonce "$MZSTD_RUN_NONCE" \
            --expected-fabric-jar "$GITHUB_WORKSPACE"/dist/Miku-ZSTD-*-Fabric.jar \
            --expected-paper-jar "$GITHUB_WORKSPACE"/dist/Miku-ZSTD-*-Paper.jar \
            --sanitized-output "$EVIDENCE_DIR/sanitized/summary.json"
      - if: ${{ always() && steps.evidence.outputs.dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: real-client-smoke-${{ github.run_id }}
          path: |
            ${{ steps.evidence.outputs.dir }}/sanitized/summary.json
            ${{ steps.evidence.outputs.dir }}/sanitized/runner-preflight.json
          if-no-files-found: warn
          retention-days: 14

# Dedicated private Linux x64 lab only. See scripts/ci/README.md for provisioning,
# scenario-driver contract, evidence fields and the difference between skip/pass.
