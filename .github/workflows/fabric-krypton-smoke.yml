name: Real Client Smoke

# Manual real-game smoke on an isolated private lab runner. Does not gate releases.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build run ID for this exact commit
        required: true
        type: string
      duration_seconds:
        description: Play-state observation duration after login
        required: false
        default: "120"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: miku-zstd-real-client-smoke
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run_allowed: ${{ steps.check.outputs.run_allowed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          RUNNER_READY: ${{ vars.MZSTD_REAL_CLIENT_RUNNER_READY }}
          LAB_HARNESS: ${{ vars.MZSTD_LAB_HARNESS }}
          SMOKE_CONFIG: ${{ vars.MZSTD_SMOKE_CONFIG }}
          SMOKE_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] || [[ "$RUNNER_READY" != "true" ]] || [[ -z "$LAB_HARNESS" ]] || [[ -z "$SMOKE_CONFIG" ]]; then
            echo "run_allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Smoke requires trusted main and an enabled lab runner; skipped, not passed."
            exit 0
          fi
          if ! [[ "$SMOKE_SECONDS" =~ ^[0-9]+$ ]] || (( SMOKE_SECONDS < 30 || SMOKE_SECONDS > 600 )); then
            echo "duration_seconds must be between 30 and 600" >&2
            exit 1
          fi
          actual=$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,headSha,status,conclusion)
          python3 -c 'import json,os,sys; d=json.loads(sys.argv[1]); assert d["workflowName"]=="Build" and d["headBranch"]=="main" and d["headSha"]==os.environ["EXPECTED_SHA"] and d["status"]=="completed" and d["conclusion"]=="success", d' "$actual"
          echo "run_allowed=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.check.outputs.run_allowed != 'true' }}
        run: echo 'Real-client smoke skipped: configure the dedicated lab runner. This is not a pass.' >> "$GITHUB_STEP_SUMMARY"
  smoke:
    needs: preflight
    if: ${{ needs.preflight.outputs.run_allowed == 'true' }}
    runs-on: [self-hosted, linux, x64, miku-zstd-real-client]
    timeout-minutes: 30
    env:
      MZSTD_LAB_HARNESS: ${{ vars.MZSTD_LAB_HARNESS }}
      MZSTD_SMOKE_CONFIG: ${{ vars.MZSTD_SMOKE_CONFIG }}
      SMOKE_SECONDS: ${{ inputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: Miku-ZSTD-*
          path: dist
          merge-multiple: true
      - name: Check private harness contract
        run: |
          set -euo pipefail
          test -x "$MZSTD_LAB_HARNESS"
          test -r "$MZSTD_SMOKE_CONFIG"
          test -s dist/Miku-ZSTD-*-Fabric.jar
          test -s dist/Miku-ZSTD-*-Paper.jar
      - name: Run actual Fabric + Krypton client through compressed FRP
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/miku-zstd-real-client-smoke"
          mkdir -p "$result"
          "$MZSTD_LAB_HARNESS" smoke --config "$MZSTD_SMOKE_CONFIG" \
            --fabric-jar "$GITHUB_WORKSPACE"/dist/Miku-ZSTD-*-Fabric.jar \
            --paper-jar "$GITHUB_WORKSPACE"/dist/Miku-ZSTD-*-Paper.jar \
            --frp-compression true --duration-seconds "$SMOKE_SECONDS" --result-dir "$result"
          python3 scripts/ci/validate_real_client_result.py smoke "$result/summary.json" \
            --expected-clients 1 --expected-sha "$GITHUB_SHA" \
            --min-duration-seconds "$SMOKE_SECONDS"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-client-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/miku-zstd-real-client-smoke
          if-no-files-found: warn
          retention-days: 14

# Requires a dedicated isolated self-hosted Linux x64 runner labeled
# miku-zstd-real-client with Java 25, an authenticated/licensed MC 26.2 Fabric
# profile (Loader 0.19.5), pinned Krypton, and xvfb/Mesa if required.
# MZSTD_LAB_HARNESS is runner-installed; MZSTD_SMOKE_CONFIG is runner-local and
# describes the Paper+FRP topology/profile. Keep auth/session material outside
# checkout. Set repository vars MZSTD_REAL_CLIENT_RUNNER_READY=true,
# MZSTD_LAB_HARNESS, MZSTD_SMOKE_CONFIG only after provisioning. Never run
# untrusted PR code on this runner.
