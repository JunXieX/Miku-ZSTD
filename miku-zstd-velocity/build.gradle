plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'mikumc.zstd'
version = '4.4.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // Velocity 4.x API（4.2.0 为当前最新正式版，兼容 4.0.0+ 运行时）
    compileOnly("com.velocitypowered:velocity-api:4.2.0")
    // Velocity 内部类型（SetCompressionPacket / LoginPluginResponsePacket / MinecraftPacket）
    // 已改为运行期反射访问（见 ZstdHijacker 的同名字段），编译只依赖下面的 velocity-api，
    // 不再需要 velocity-proxy.jar —— 该 jar 不在任何公开 Maven 仓库里，以前缺了就根本编不过。
    // 本地若恰好有同版本 proxy jar，仍可用 -PvelocityProxyJar=<路径> 挂上（仅供 IDE 补全/交叉检查），
    // 缺失不影响编译与产物。
    def proxyJar = file(findProperty('velocityProxyJar') ?: 'libs/velocity-proxy.jar')
    if (proxyJar.exists()) {
        compileOnly(files(proxyJar))
    }
    annotationProcessor("com.velocitypowered:velocity-api:4.2.0")
    // Netty 由 Velocity 运行时提供，仅用于编译。
    // ⚠️ 必须对齐运行期的主版本：实测 Velocity 4.1.1 内置 Netty **4.2.16.Final**
    //（见其 META-INF/io.netty.versions.properties）。以前这里写 4.1.107.Final，
    // 于是"编译期 4.1 / 运行期 4.2"——跨大版本编译虽然当前能跑（只用到 buffer/codec/
    // transport 里最稳定的一批 API），但一旦某个签名变了，本地编译不会报错、运行期才炸。
    compileOnly("io.netty:netty-all:4.2.16.Final")
    // zstd-jni：原生库随 shadowJar 打包
    implementation("com.github.luben:zstd-jni:1.5.7-17")
    // Velocity 4 可能不再自带 snakeyaml，随插件打包兜底
    implementation("org.yaml:snakeyaml:2.2")

    // ── 测试 ──────────────────────────────────────────────────────────────
    // 协议回归测试需要 netty、zstd 与 slf4j 在运行期可见：zstd-jni 由 implementation
    // 传递；netty 与 slf4j 平时都是 compileOnly（由代理运行时提供），所以要在
    // test 作用域再声明一次——共享基类在 <clinit> 里就取 Logger，
    // 缺 slf4j 会让每个用例以 NoClassDefFoundError 失败（TestEncoder/TestDecoder
    // "Could not initialize class" 的根因就是它）。
    testImplementation("io.netty:netty-all:4.2.16.Final")
    testImplementation("org.slf4j:slf4j-api:2.0.17")
    // ⚠️ 这里必须用 slf4j-simple（会打到 stderr），不能用 slf4j-nop：
    // 共享编解码器在拒绝畸形帧时会自行 LOGGER.warn 出**具体原因**，
    // 而断言失败只告诉你"没产出包"。用 nop 就把唯一的线索吞掉了。
    testRuntimeOnly("org.slf4j:slf4j-simple:2.0.17")
    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// 产物命名：Miku-ZSTD-<版本>-Velocity.jar
// Gradle 的文件名格式固定为 archivesName-archiveVersion-archiveClassifier，
// 所以把模块名放在 classifier 上，正好得到「版本号在前、模块名在后」的目标格式。

// ── native 库瘦身 ────────────────────────────────────────────────────────────
// 真正的裁剪规则是下面 shadowJar 里那一组 exclude；要改保留平台就直接改那里。
// （这里曾有一个 def slimNativeExcludes 列表，定义了却从未被引用——
//  它和 exclude 两组内容重复，只会在改配置时让人以为改它就生效了。）

shadowJar {
    archiveClassifier.set('Velocity')

    // 裁掉不会部署本插件的平台（18 个原生库约占 jar 体积的 93%，而运行时只会
    // 加载匹配当前平台的那一个——其余既不占内存也不参与加载，纯粹是磁盘与分发开销）。
    // 保留：Windows(x64/arm64)、Linux(x64/arm64)、macOS(x64/arm64)。
    // 要跑在别的架构上时，从下面删掉对应那一行即可。
    exclude 'aix/**'
    exclude 'freebsd/**'
    exclude 'linux/riscv64/**'
    exclude 'linux/ppc64/**'
    exclude 'linux/ppc64le/**'
    exclude 'linux/mips64/**'
    exclude 'linux/loongarch64/**'
    exclude 'linux/s390x/**'
    exclude 'linux/i386/**'
    exclude 'linux/arm/**'
    exclude 'win/x86/**'
}

def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
    // 开启全部静态检查。其中 -processing 被显式关掉：
    // Velocity 的注解处理器只消费 @Plugin，而 @DataDirectory/@Subscribe/@Inject
    // 本来就不该被它消费，javac 会为此报"注解未被处理"——属噪声，非问题。
    options.compilerArgs << '-Xlint:all' << '-Xlint:-processing'
}

def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')
def generateTemplates = tasks.register('generateTemplates', Copy) { task ->
    def props = ['version': project.version]
    task.inputs.properties props

    task.from templateSource
    task.into templateDest
    task.expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

// ── 共享协议模块 ─────────────────────────────────────────────────────────────
// 两端引用同一份源码（miku-zstd-protocol/）：帧格式、VarInt、批处理与切包逻辑
// 对"逐字节对称"的要求极高，单一实现可在结构上杜绝跨端漂移。
// 该模块不是独立 Gradle 工程（本项目两个模块各自独立构建），因此用 srcDir
// 引用共享源码目录——共享代码会被编译进各自的 jar，无需额外的打包配置。
sourceSets {
    main {
        java {
            srcDir(new File(rootDir.parentFile, 'miku-zstd-protocol/src/main/java'))
        }
    }
    // 共享协议层的测试与被测代码放在一起（miku-zstd-protocol/src/test/java），
    // 由本模块负责执行。为什么挂在 Velocity 端：三个模块里只有它是纯 java 插件
    // （Paper 要 paper-api、Fabric 要 Loom），跑纯 JVM 测试的代价最小，
    // 而且这些测试只依赖 netty + zstd，不需要任何 Minecraft 类。
    test {
        java {
            srcDir(new File(rootDir.parentFile, 'miku-zstd-protocol/src/test/java'))
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 协议不变量测试是"改错就炸"的那一类，失败时要能直接看到具体是哪条
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
