# Miku-ZSTD — Paper 端（纯 Paper，无 Bukkit/Spigot 兼容层）
name: Miku-ZSTD
version: 4.6.0
main: mikumc.zstd.paper.MikuZstdPaper
api-version: 1.26
authors: [JunXieX]
description: 用 zstd 替代原版 zlib 压缩玩家连接的网络流量（需客户端安装 Miku-ZSTD 模组）
website: https://github.com/JunXieX/Miku-ZSTD

permissions:
  mikuzstd.command:
    description: 使用 /mikuzstd 的 BossBar 监控开关（status / top 等只读子命令对所有人开放）
    default: op
