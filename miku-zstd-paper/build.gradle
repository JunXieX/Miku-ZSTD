plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'mikumc.zstd'
version = '4.9.2-Beta'

base {
    archivesName = 'Miku-ZSTD'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // 纯 Paper：只依赖 paper-api（不引入 spigot-api / bukkit 兼容层）
    compileOnly("io.papermc.paper:paper-api:26.2.build.124-stable")
    // Netty 由服务端提供（MC 26.x 未混淆，反射即可访问管线），仅用于编译。
    // ⚠️ 对齐运行期主版本：MC 26.2 内置 Netty **4.2.15.Final**。
    // 以前写 4.1.107.Final 会造成"编译期 4.1 / 运行期 4.2"，跨大版本的风险在于
    // 签名变更时本地编译不报错、运行期才炸。
    compileOnly("io.netty:netty-all:4.2.15.Final")
    // zstd：Paper 服务端自带 zstd-jni 1.5.7-15（在 META-INF/libraries 中），
    // 但插件类加载器访问不到，因此随插件打包 1.5.7-17，避免版本/可见性歧义。
    implementation("com.github.luben:zstd-jni:1.5.7-17")
    implementation("org.yaml:snakeyaml:2.2")
}

// 共享协议模块（与 Velocity / Fabric 端同一份源码）
sourceSets {
    main {
        java {
            srcDir(new File(rootDir.parentFile, 'miku-zstd-protocol/src/main/java'))
        }
    }
}

def targetJavaVersion = 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
    options.compilerArgs << '-Xlint:all' << '-Xlint:-processing'
}


// ── native 库瘦身 ────────────────────────────────────────────────────────────
// 真正的裁剪规则是下面 shadowJar 里那一组 exclude；要改保留平台就直接改那里。
// （这里曾有一个 def slimNativeExcludes 列表，定义了却从未被引用——
//  它和 exclude 两组内容重复，只会在改配置时让人以为改它就生效了。）

shadowJar {
    archiveClassifier.set('Paper')

    // snakeyaml 是纯 Java，relocate 安全：避免与同机其它插件的同名类冲突
    //（类加载顺序决定谁生效 → 莫名的 NoSuchMethodError）。
    relocate 'org.yaml.snakeyaml', 'mikumc.zstd.libs.snakeyaml'

    // ⚠️ zstd-jni **绝不能** relocate：它的 native 方法按 **Java 类名**绑定
    //（JNI 符号形如 Java_com_github_luben_zstd_ZstdCompressCtx_init），换包名后
    // 原生库里找不到对应符号，直接 UnsatisfiedLinkError —— 4.9.1-Beta 真机实测踩过。
    // 「库文件名 libzstd-jni-<版本> 与包名无关」不等于「JNI 符号与包名无关」。
    // 与同机插件 zstd-jni 版本冲突的风险只能接受（目前几乎没有插件会打包它）。

    // 裁掉不会部署本插件的平台（18 个原生库约占 jar 体积的 93%，而运行时只会
    // 加载匹配当前平台的那一个——其余既不占内存也不参与加载，纯粹是磁盘与分发开销）。
    // 保留：Windows(x64/arm64)、Linux(x64/arm64)、macOS(x64/arm64)。
    // 要跑在别的架构上时，从下面删掉对应那一行即可。
    exclude 'aix/**'
    exclude 'freebsd/**'
    exclude 'linux/riscv64/**'
    exclude 'linux/ppc64/**'
    exclude 'linux/ppc64le/**'
    exclude 'linux/mips64/**'
    exclude 'linux/loongarch64/**'
    exclude 'linux/s390x/**'
    exclude 'linux/i386/**'
    exclude 'linux/arm/**'
    exclude 'win/x86/**'
}
